[package]
name = "chrysalis_solana_sender"
version = "0.1.0"
description = "Solana source wrapper for Chrysalis CCTP and CCIP routes"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chrysalis_solana_sender"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = "=0.30.1"
blake3 = "=1.5.5"
indexmap = "=2.2.6"
zeroize_derive = "=1.4.2"
borsh = "=1.5.1"
borsh-derive = "=1.5.1"
unicode-segmentation = "=1.10.1"
